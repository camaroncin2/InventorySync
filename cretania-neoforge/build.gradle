plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = project.property('mod_version')
group = project.property('mod_group')

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

base {
    archivesName = 'cretania-neoforge'
}

neoForge {
    version = project.property('neoforge_version')

    runs {
        server {
            server()
        }
    }

    mods {
        "${project.property('mod_id')}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // MongoDB Sync Driver
    implementation "org.mongodb:mongodb-driver-sync:${project.property('mongodb_driver_version')}"
    jarJar("org.mongodb:mongodb-driver-sync") {
        version {
            strictly "[5.0,6)"
            prefer "${project.property('mongodb_driver_version')}"
        }
    }

    // MongoDB Driver Core (transitiva, pero declarada explícitamente para jarJar)
    implementation "org.mongodb:mongodb-driver-core:${project.property('mongodb_driver_version')}"
    jarJar("org.mongodb:mongodb-driver-core") {
        version {
            strictly "[5.0,6)"
            prefer "${project.property('mongodb_driver_version')}"
        }
    }

    // BSON (transitiva, pero declarada explícitamente para jarJar)
    implementation "org.mongodb:bson:${project.property('mongodb_driver_version')}"
    jarJar("org.mongodb:bson") {
        version {
            strictly "[5.0,6)"
            prefer "${project.property('mongodb_driver_version')}"
        }
    }
}
